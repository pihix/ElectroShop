name: Frontend CI - CD

on:
  workflow_run:
    workflows: ["Backend CI - CD"]
    types:
      - completed
  push:
    branches:
      - main
      - dev
      - feature/**
      - stage
      - deploy
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_cicd.yml"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  frontend_lint:
    name: Lint Frontend Code
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  frontend_test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

  frontend_build:
    name: Build Frontend App
    runs-on: ubuntu-latest
    needs: [frontend_test, frontend_lint]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build App
        run: npm run build

  frontend_docker_build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: frontend_build
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t frontend-electroshop:${{ github.sha }} .

  push-frontend-ecr:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: frontend_docker_build
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ vars.AWS_REGION }}
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t frontend-electroshop:${{ github.sha }} .

      - name: Tag & Push image
        run: |
          docker tag frontend-electroshop:${{ github.sha }} ${{ secrets.ECR_REPO_FRONTEND }}:${{ github.sha }}
          docker push ${{ secrets.ECR_REPO_FRONTEND }}:${{ github.sha }}

  deploy_frontend:
    name: Deploy Frontend on EC2
    runs-on: ubuntu-latest
    needs: push-frontend-ecr

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Connect & Deploy Frontend
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            docker login -u AWS -p $(aws ecr get-login-password --region ${{ vars.AWS_REGION }}) ${{ secrets.ECR_DOMAIN }}

            docker pull ${{ secrets.ECR_REPO_FRONTEND }}:${{ github.sha }}

            docker stop frontend || true && docker rm frontend || true
            docker run -d --name frontend -p 80:5173 ${{ secrets.ECR_REPO_FRONTEND }}:${{ github.sha }}
          EOF

# test

