name: Backend CI - CD
# trigger
on:
  push:
    branches:
      - main
      - dev
      - feature/**
      - stage
      - deploy
    paths:
      - "backend/**"
      - ".github/workflows/backend_cicd.yml"
  pull_request:
    branches:
      - main
      - dev

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV_FILE: .env
      db_username: test_user
      db_password: test_password
      db_hostname: localhost
      db_port: 5432
      db_name: test_db
      secret_key: "testsecret"
      algorithm: "HS256"
      access_token_expire_minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t electroshop-backend:latest -f Dockerfile .

  push-backend-ecr:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ vars.AWS_REGION }}
          aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ECR_REPO_BACKEND }}:${{ github.sha }} .

      - name: Tag & Push image
        run: |
          docker push ${{ secrets.ECR_REPO_BACKEND }}:${{ github.sha }}
